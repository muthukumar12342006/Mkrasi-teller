<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK Decision Checker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#0A0E17; --bg2:#0F1524; --panel:rgba(255,255,255,.045); --panel-brd:rgba(255,255,255,.09);
  --ink:#EAF0FA; --ink-dim:#8E9BB3; --line:rgba(255,255,255,.08);
  --accent:#F5A623; --accent-ink:#241a04;
  --a-op:#3FC1B0; --b-op:#8B7FD6; --c-op:#E8607A; --d-op:#5B9BF0;
  --good:#3FC1B0; --warn:#F5A623; --bad:#E8607A;
  --radius:18px; --font-d:'Space Grotesk',sans-serif; --font-b:'Inter',sans-serif; --font-m:'JetBrains Mono',monospace;
  --shadow:0 20px 60px -20px rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#F5F6FA; --bg2:#ECEEF5; --panel:rgba(255,255,255,.65); --panel-brd:rgba(20,25,40,.08);
  --ink:#141A2B; --ink-dim:#5C6479; --line:rgba(20,25,40,.08);
  --shadow:0 20px 50px -25px rgba(30,35,60,.25);
}
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:radial-gradient(circle at 15% 0%, var(--bg2), var(--bg) 60%);
  color:var(--ink); font-family:var(--font-b); min-height:100vh; transition:background .4s,color .4s;
  padding-bottom:60px;
}
h1,h2,h3,.brand{font-family:var(--font-d);}
::selection{background:var(--accent); color:var(--accent-ink);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s !important; transition-duration:.001s !important;}}

/* ============ LAYOUT ============ */
.wrap{max-width:1180px; margin:0 auto; padding:0 22px;}
header{position:sticky; top:0; z-index:50; backdrop-filter:blur(14px); background:color-mix(in srgb, var(--bg) 75%, transparent); border-bottom:1px solid var(--line);}
.headbar{display:flex; align-items:center; justify-content:space-between; padding:16px 0;}
.brand{display:flex; align-items:center; gap:10px; font-size:1.25rem; font-weight:700; letter-spacing:-.02em;}
.scale-mark{width:30px; height:30px;}
.headctl{display:flex; gap:8px; align-items:center;}
.iconbtn{background:var(--panel); border:1px solid var(--panel-brd); color:var(--ink); width:40px; height:40px; border-radius:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s;}
.iconbtn:hover{border-color:var(--accent); transform:translateY(-1px);}
select.lang{background:var(--panel); border:1px solid var(--panel-brd); color:var(--ink); border-radius:12px; padding:9px 10px; font-family:var(--font-b); font-size:.85rem; cursor:pointer;}

.tabs{display:flex; gap:6px; margin:22px 0 18px;}
.tab{padding:10px 18px; border-radius:100px; background:var(--panel); border:1px solid var(--panel-brd); color:var(--ink-dim); font-weight:600; font-size:.88rem; cursor:pointer; transition:.2s;}
.tab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

.glass{background:var(--panel); border:1px solid var(--panel-brd); border-radius:var(--radius); box-shadow:var(--shadow); backdrop-filter:blur(18px);}
.card{padding:26px; margin-bottom:20px; animation:rise .5s ease both;}
@keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

.section-title{font-size:1.02rem; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.section-title .num{font-family:var(--font-m); font-size:.72rem; color:var(--accent); border:1px solid var(--panel-brd); border-radius:6px; padding:2px 7px;}

label{display:block; font-size:.78rem; color:var(--ink-dim); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
input[type=text], input[type=number], textarea, select{
  width:100%; background:color-mix(in srgb, var(--bg) 40%, transparent); border:1px solid var(--panel-brd); color:var(--ink);
  border-radius:12px; padding:12px 14px; font-family:var(--font-b); font-size:.92rem; transition:.2s;
}
[data-theme="light"] input, [data-theme="light"] textarea, [data-theme="light"] select{background:#fff;}
input:focus, textarea:focus, select:focus{border-color:var(--accent);}
textarea{resize:vertical; min-height:80px;}
.field{margin-bottom:16px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr;}}

.opt-row{display:flex; gap:10px; margin-bottom:10px; align-items:center;}
.opt-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
.opt-row input{flex:1;}
.rm-opt{background:transparent; border:1px solid var(--panel-brd); color:var(--ink-dim); border-radius:8px; width:34px; height:34px; cursor:pointer; flex-shrink:0;}
.rm-opt:hover{color:var(--bad); border-color:var(--bad);}
.add-opt{background:transparent; border:1px dashed var(--panel-brd); color:var(--ink-dim); border-radius:10px; padding:9px 14px; cursor:pointer; font-size:.85rem; font-weight:600; width:100%; margin-top:4px;}
.add-opt:hover{color:var(--accent); border-color:var(--accent);}

.mic-wrap{position:relative;}
.mic-btn{position:absolute; right:8px; top:8px; background:transparent; border:none; color:var(--ink-dim); cursor:pointer; padding:6px; border-radius:8px;}
.mic-btn.live{color:var(--bad); animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.4;}}

.btn{font-family:var(--font-d); font-weight:600; border:none; border-radius:100px; padding:14px 26px; cursor:pointer; font-size:.95rem; transition:.2s; display:inline-flex; align-items:center; gap:8px;}
.btn-primary{background:linear-gradient(135deg, var(--accent), #ffb84d); color:var(--accent-ink); box-shadow:0 10px 30px -8px rgba(245,166,35,.5);}
.btn-primary:hover{transform:translateY(-2px);}
.btn-primary:disabled{opacity:.6; cursor:wait; transform:none;}
.btn-ghost{background:var(--panel); border:1px solid var(--panel-brd); color:var(--ink);}
.btn-ghost:hover{border-color:var(--accent);}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}

/* Results */
#results{display:none;}
.reco-hero{padding:30px; position:relative; overflow:hidden;}
.reco-hero::before{content:""; position:absolute; inset:0; background:radial-gradient(circle at 90% -10%, color-mix(in srgb, var(--accent) 25%, transparent), transparent 60%); pointer-events:none;}
.reco-eyebrow{font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:8px;}
.reco-title{font-size:1.7rem; font-weight:700; margin-bottom:10px;}
.reco-why{color:var(--ink-dim); line-height:1.6; margin-bottom:18px; max-width:70ch;}
.conf-gauge{display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
.gauge-num{font-family:var(--font-m); font-size:2.4rem; font-weight:700; color:var(--accent);}
.gauge-bar{flex:1; min-width:160px; height:10px; background:var(--line); border-radius:100px; overflow:hidden;}
.gauge-fill{height:100%; background:linear-gradient(90deg, var(--a-op), var(--accent)); border-radius:100px; transition:width 1s ease;}

.opt-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px;}
.opt-card{padding:22px; border-top:3px solid var(--accent); animation:rise .5s ease both;}
.opt-card h3{font-size:1.05rem; margin-bottom:4px;}
.opt-card .rating{font-family:var(--font-m); color:var(--ink-dim); font-size:.82rem; margin-bottom:14px;}
.opt-card .stat-row{display:flex; justify-content:space-between; font-size:.82rem; padding:6px 0; border-bottom:1px solid var(--line);}
.opt-card .stat-row span:first-child{color:var(--ink-dim);}
.pc-lists{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
.pc-lists ul{list-style:none; font-size:.82rem; line-height:1.6;}
.pc-lists li{padding-left:16px; position:relative; margin-bottom:4px;}
.pc-lists .pros li::before{content:"+"; position:absolute; left:0; color:var(--good); font-weight:700;}
.pc-lists .cons li::before{content:"–"; position:absolute; left:0; color:var(--bad); font-weight:700;}
.pc-lists h4{font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); margin-bottom:6px;}

.charts-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
@media(max-width:820px){.charts-grid{grid-template-columns:1fr;}}
.chart-box{padding:20px; height:340px;}
.chart-box canvas{max-height:280px;}

table.matrix{width:100%; border-collapse:collapse; font-size:.85rem;}
table.matrix th, table.matrix td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line);}
table.matrix th{color:var(--ink-dim); font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em;}
table.matrix td.score{font-family:var(--font-m); font-weight:700;}
table.matrix tr.best{background:color-mix(in srgb, var(--accent) 10%, transparent);}

.swot-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:600px){.swot-grid{grid-template-columns:1fr;}}
.swot-box{padding:16px; border-radius:14px; border:1px solid var(--panel-brd);}
.swot-box h4{font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px;}
.swot-box ul{font-size:.83rem; line-height:1.6; padding-left:18px;}
.swot-s{border-left:3px solid var(--good);} .swot-w{border-left:3px solid var(--bad);}
.swot-o{border-left:3px solid var(--d-op);} .swot-t{border-left:3px solid var(--accent);}

.tag{display:inline-block; padding:3px 10px; border-radius:100px; font-size:.72rem; font-weight:600; margin:2px 4px 2px 0;}
.tag-risk{background:color-mix(in srgb, var(--bad) 18%, transparent); color:var(--bad);}
.tag-opp{background:color-mix(in srgb, var(--good) 18%, transparent); color:var(--good);}

.hist-item{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); cursor:pointer; transition:.15s;}
.hist-item:hover{background:color-mix(in srgb, var(--accent) 6%, transparent);}
.hist-item .h-title{font-weight:600;}
.hist-item .h-meta{font-size:.75rem; color:var(--ink-dim); font-family:var(--font-m);}
.hist-del{background:transparent; border:none; color:var(--ink-dim); cursor:pointer; font-size:1.1rem;}
.hist-del:hover{color:var(--bad);}

.empty{text-align:center; padding:50px 20px; color:var(--ink-dim);}
.spinner{width:18px; height:18px; border:2px solid var(--accent-ink); border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:100px; font-size:.85rem; font-weight:600; z-index:200; opacity:0; pointer-events:none; transition:.3s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
.hint{font-size:.72rem; color:var(--ink-dim); margin-top:4px;}
.kbd{font-family:var(--font-m); background:var(--panel); border:1px solid var(--panel-brd); padding:1px 6px; border-radius:5px; font-size:.72rem;}
@media print{header,.tabs,.card:not(.print-yes),.btn-row,#formCard,select.lang{display:none !important;} body{background:#fff; color:#000;}}
</style>
</head>
<body data-theme="dark">

<header>
  <div class="wrap headbar">
    <div class="brand">
      <svg class="scale-mark" viewBox="0 0 40 40" fill="none">
        <path d="M20 4v30M9 12l-6 12a6 6 0 0012 0zM31 12l-6 12a6 6 0 0012 0zM8 12h24M20 34h-8m8 0h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      MK Decision Checker
    </div>
    <div class="headctl">
      <select class="lang" id="langSel" aria-label="Language" title="Language">
        <option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option><option value="hi">HI</option>
      </select>
      <button class="iconbtn" id="themeBtn" title="Toggle theme (Ctrl+D)">🌙</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-tab="new">New Decision</button>
    <button class="tab" data-tab="history">History</button>
  </div>

  <!-- ============ NEW DECISION TAB ============ -->
  <section id="tab-new">
    <div class="glass card" id="formCard">
      <div class="section-title"><span class="num">1</span> Describe your decision</div>
      <div class="field">
        <label for="dTitle">Decision title</label>
        <input type="text" id="dTitle" placeholder="e.g. Should I switch jobs?">
      </div>
      <div class="field mic-wrap">
        <label for="dDesc">Describe the situation</label>
        <textarea id="dDesc" placeholder="Give context: what's driving this decision, constraints, who's affected..."></textarea>
        <button class="mic-btn" data-target="dDesc" title="Voice input">🎤</button>
      </div>

      <div class="section-title"><span class="num">2</span> Your options</div>
      <div id="optionsList"></div>
      <button class="add-opt" id="addOpt">+ Add another option</button>

      <div class="section-title" style="margin-top:22px"><span class="num">3</span> Priorities & constraints</div>
      <div class="grid2">
        <div class="field mic-wrap">
          <label for="dGoal">Goal / priority</label>
          <input type="text" id="dGoal" placeholder="e.g. maximize long-term growth">
          <button class="mic-btn" data-target="dGoal" title="Voice input">🎤</button>
        </div>
        <div class="field">
          <label for="dBudget">Budget (optional)</label>
          <input type="text" id="dBudget" placeholder="e.g. $5,000">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="dTime">Time limit</label>
          <input type="text" id="dTime" placeholder="e.g. decide by end of month">
        </div>
        <div class="field">
          <label for="dImportance">Importance level</label>
          <select id="dImportance"><option>Low</option><option selected>Medium</option><option>High</option></select>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="analyzeBtn">✨ Analyze decision</button>
        <button class="btn btn-ghost" id="clearBtn">Clear form</button>
      </div>
      <div class="hint">Shortcuts: <span class="kbd">Ctrl+Enter</span> analyze · <span class="kbd">Ctrl+D</span> theme</div>
    </div>

    <!-- ============ RESULTS ============ -->
    <div id="results">
      <div class="glass card reco-hero print-yes">
        <div class="reco-eyebrow">AI Recommendation</div>
        <div class="reco-title" id="rBest">—</div>
        <div class="reco-why" id="rWhy"></div>
        <div class="conf-gauge">
          <div class="gauge-num" id="rConf">0%</div>
          <div class="gauge-bar"><div class="gauge-fill" id="rConfBar" style="width:0%"></div></div>
        </div>
        <div id="rRisksTags" style="margin-top:16px"></div>
        <div style="margin-top:14px; font-size:.87rem; color:var(--ink-dim)" id="rOutcome"></div>
        <div style="margin-top:10px; font-size:.87rem" id="rTips"></div>
      </div>

      <div class="glass card">
        <div class="section-title">Option breakdown</div>
        <div class="opt-cards" id="optCards"></div>
      </div>

      <div class="glass card">
        <div class="section-title">Decision matrix</div>
        <div style="overflow-x:auto"><table class="matrix" id="matrixTable"></table></div>
      </div>

      <div class="charts-grid">
        <div class="glass chart-box"><canvas id="radarChart"></canvas></div>
        <div class="glass chart-box"><canvas id="barChart"></canvas></div>
        <div class="glass chart-box"><canvas id="pieChart"></canvas></div>
        <div class="glass card" style="height:340px; overflow:auto">
          <div class="section-title">SWOT — <span id="swotOptName" style="color:var(--ink-dim); font-weight:400"></span></div>
          <div class="swot-grid" id="swotGrid"></div>
        </div>
      </div>

      <div class="glass card">
        <div class="section-title">Hidden risks & opportunities</div>
        <div id="risksOpps"></div>
      </div>

      <div class="glass card">
        <div class="section-title">Decision tree</div>
        <div id="decisionTree" style="font-size:.88rem; line-height:1.8; font-family:var(--font-m)"></div>
      </div>

      <div class="glass card">
        <div class="section-title">What-if analysis</div>
        <div id="whatIf" style="font-size:.88rem; line-height:1.7; color:var(--ink-dim)"></div>
      </div>

      <div class="glass card">
        <div class="section-title">Export & share</div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="printBtn">🖨️ Print / PDF</button>
          <button class="btn btn-ghost" id="csvBtn">⬇️ Export CSV</button>
          <button class="btn btn-ghost" id="copyBtn">📋 Copy summary</button>
          <button class="btn btn-ghost" id="shareBtn">🔗 Share</button>
          <button class="btn btn-ghost" id="speakBtn">🔊 Read aloud</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ HISTORY TAB ============ -->
  <section id="tab-history" style="display:none">
    <div class="glass card">
      <div class="section-title">Saved decisions</div>
      <input type="text" id="histSearch" placeholder="Search history..." style="margin-bottom:14px">
      <div id="histList"></div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   MK DECISION CHECKER — application logic
   Modules: state, i18n, storage, speech, api, matrix, charts,
   render, export, history, events
   ========================================================= */

/* ---------- 1. STATE ---------- */
const OPT_COLORS = ['#F5A623','#3FC1B0','#8B7FD6','#E8607A','#5B9BF0','#F0C419','#63D2FF'];
let state = {
  options: ['', ''],       // option name inputs, unlimited
  analysis: null,          // last AI analysis result
  charts: {},               // chart.js instances
  storageAvailable: true
};

/* ---------- 2. i18n (lightweight) ---------- */
const I18N = {
  en:{analyze:"Analyze decision", best:"Best option"},
  es:{analyze:"Analizar decisión", best:"Mejor opción"},
  fr:{analyze:"Analyser la décision", best:"Meilleure option"},
  hi:{analyze:"निर्णय का विश्लेषण करें", best:"सर्वश्रेष्ठ विकल्प"}
};
document.getElementById('langSel').addEventListener('change', e=>{
  const t = I18N[e.target.value] || I18N.en;
  document.getElementById('analyzeBtn').textContent = '✨ ' + t.analyze;
});

/* ---------- 3. STORAGE (persistent artifact storage, not localStorage) ---------- */
// Note: browser localStorage is not supported inside Claude.ai artifacts,
// so decision history is saved with the artifact's built-in window.storage API,
// which persists per-user across sessions in this environment.
async function saveDecision(record){
  try{
    await window.storage.set('decision:'+record.id, JSON.stringify(record), false);
    return true;
  }catch(e){ console.error('storage save failed', e); return false; }
}
async function loadAllDecisions(){
  try{
    const list = await window.storage.list('decision:', false);
    if(!list || !list.keys) return [];
    const out = [];
    for(const k of list.keys){
      try{ const r = await window.storage.get(k.key || k, false); if(r) out.push(JSON.parse(r.value)); }catch(e){}
    }
    return out.sort((a,b)=>b.ts-a.ts);
  }catch(e){ console.error('storage list failed', e); return []; }
}
async function deleteDecision(id){
  try{ await window.storage.delete('decision:'+id, false); }catch(e){ console.error(e); }
}

/* ---------- 4. OPTIONS UI ---------- */
function renderOptions(){
  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  state.options.forEach((val, i)=>{
    const row = document.createElement('div');
    row.className = 'opt-row';
    row.innerHTML = `
      <span class="opt-dot" style="background:${OPT_COLORS[i % OPT_COLORS.length]}"></span>
      <input type="text" data-idx="${i}" class="opt-input" placeholder="Option ${String.fromCharCode(65+i)}" value="${escapeAttr(val)}">
      ${state.options.length>2 ? `<button class="rm-opt" data-idx="${i}" title="Remove">✕</button>` : ''}
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('.opt-input').forEach(inp=>{
    inp.addEventListener('input', e=> state.options[+e.target.dataset.idx] = e.target.value);
  });
  list.querySelectorAll('.rm-opt').forEach(btn=>{
    btn.addEventListener('click', e=>{
      state.options.splice(+e.target.dataset.idx,1);
      renderOptions();
    });
  });
}
document.getElementById('addOpt').addEventListener('click', ()=>{
  state.options.push('');
  renderOptions();
});
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
renderOptions();

/* ---------- 5. VOICE INPUT / OUTPUT ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
document.querySelectorAll('.mic-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(!SR){ toast('Voice input not supported in this browser'); return; }
    const target = document.getElementById(btn.dataset.target);
    const rec = new SR();
    rec.lang = document.getElementById('langSel').value === 'en' ? 'en-US' : document.getElementById('langSel').value;
    btn.classList.add('live');
    rec.onresult = e=>{ target.value += (target.value?' ':'') + e.results[0][0].transcript; };
    rec.onend = ()=> btn.classList.remove('live');
    rec.onerror = ()=> btn.classList.remove('live');
    rec.start();
  });
});
function speak(text){
  if(!window.speechSynthesis){ toast('Speech output not supported'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  window.speechSynthesis.speak(u);
}

/* ---------- 6. AI ANALYSIS (Anthropic API) ---------- */
async function runAnalysis(payload){
  const optionNames = payload.options.filter(o=>o.trim());
  const prompt = `You are an unbiased decision-analysis engine. Analyze this decision and respond with ONLY valid JSON (no markdown fences, no preamble).

Decision title: ${payload.title}
Situation: ${payload.situation}
Options: ${optionNames.join(' | ')}
Goal/Priority: ${payload.goal}
Budget: ${payload.budget || 'not specified'}
Time limit: ${payload.timeLimit || 'not specified'}
Importance: ${payload.importance}
Respond in language code: ${payload.lang}

Return JSON exactly matching this schema:
{
 "options":[
   {"name":"", "pros":["",""], "cons":["",""],
    "risks":["",""], "successProbability":0-100, "financialImpact":"low|medium|high",
    "timeRequired":"short text", "difficulty":"low|medium|high", "longTermImpact":"short text",
    "shortTermImpact":"short text", "emotionalImpact":"short text", "confidenceScore":0-100,
    "overallRating":0-10,
    "matrix":{"cost":0-10,"time":0-10,"risk":0-10,"benefits":0-10,"personalGoals":0-10,"futureGrowth":0-10,"overall":0-10},
    "swot":{"strengths":["",""],"weaknesses":["",""],"opportunities":["",""],"threats":["",""]}
   }
 ],
 "bestOption":"name of best option",
 "why":"2-3 sentence justification",
 "possibleRisks":["",""],
 "expectedOutcome":"1-2 sentences",
 "tips":["",""],
 "finalConfidence":0-100,
 "hiddenRisks":["",""],
 "opportunities":["",""],
 "decisionTree":["Step-like lines describing branching logic, 4-6 short lines"],
 "whatIf":"2-4 sentence what-if scenario analysis exploring how changing budget/time/priority shifts the outcome"
}
For "matrix" scores: higher is always better (e.g. low cost/time/risk should map to a HIGH score since that's favorable). Be realistic and unbiased; do not always favor the first option.`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{role:"user", content: prompt}]
    })
  });
  if(!response.ok) throw new Error('API error '+response.status);
  const data = await response.json();
  const text = (data.content||[]).map(b=>b.text||'').join('\n');
  const clean = text.replace(/```json|```/g,'').trim();
  return JSON.parse(clean);
}

/* ---------- 7. ANALYZE BUTTON FLOW ---------- */
document.getElementById('analyzeBtn').addEventListener('click', async ()=>{
  const title = document.getElementById('dTitle').value.trim();
  const situation = document.getElementById('dDesc').value.trim();
  const options = state.options.filter(o=>o.trim());
  const goal = document.getElementById('dGoal').value.trim();
  const budget = document.getElementById('dBudget').value.trim();
  const timeLimit = document.getElementById('dTime').value.trim();
  const importance = document.getElementById('dImportance').value;
  const lang = document.getElementById('langSel').value;

  if(!title || options.length < 2){
    toast('Add a title and at least two options');
    return;
  }
  const btn = document.getElementById('analyzeBtn');
  const origText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Analyzing...';

  try{
    const result = await runAnalysis({title, situation, options, goal, budget, timeLimit, importance, lang});
    state.analysis = result;
    renderResults(result, {title, situation, goal, budget, timeLimit, importance});
    document.getElementById('results').style.display = 'block';
    document.getElementById('results').scrollIntoView({behavior:'smooth'});
    // persist to history
    const record = {
      id: 'd'+Date.now(), ts: Date.now(), title, situation, goal, budget, timeLimit, importance,
      options, analysis: result
    };
    await saveDecision(record);
  }catch(err){
    console.error(err);
    toast('Analysis failed — please try again');
  }finally{
    btn.disabled = false;
    btn.innerHTML = origText;
  }
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  document.getElementById('dTitle').value='';
  document.getElementById('dDesc').value='';
  document.getElementById('dGoal').value='';
  document.getElementById('dBudget').value='';
  document.getElementById('dTime').value='';
  state.options = ['',''];
  renderOptions();
  document.getElementById('results').style.display='none';
});

/* ---------- 8. RENDER RESULTS ---------- */
function renderResults(a, meta){
  document.getElementById('rBest').textContent = a.bestOption || '—';
  document.getElementById('rWhy').textContent = a.why || '';
  document.getElementById('rConf').textContent = (a.finalConfidence||0)+'%';
  requestAnimationFrame(()=> document.getElementById('rConfBar').style.width = (a.finalConfidence||0)+'%');
  document.getElementById('rOutcome').innerHTML = '<strong>Expected outcome:</strong> ' + (a.expectedOutcome||'');
  document.getElementById('rTips').innerHTML = '<strong>Tips before deciding:</strong> ' + (a.tips||[]).map(t=>'• '+t).join('  ');
  document.getElementById('rRisksTags').innerHTML = (a.possibleRisks||[]).map(r=>`<span class="tag tag-risk">⚠ ${r}</span>`).join('');

  // option cards
  const optCards = document.getElementById('optCards');
  optCards.innerHTML = '';
  (a.options||[]).forEach((o,i)=>{
    const isBest = o.name === a.bestOption;
    const el = document.createElement('div');
    el.className = 'glass opt-card';
    el.style.borderTopColor = OPT_COLORS[i%OPT_COLORS.length];
    el.innerHTML = `
      <h3>${o.name} ${isBest?'⭐':''}</h3>
      <div class="rating">Overall rating: ${o.overallRating}/10 · Confidence ${o.confidenceScore}%</div>
      <div class="stat-row"><span>Success probability</span><span>${o.successProbability}%</span></div>
      <div class="stat-row"><span>Financial impact</span><span>${o.financialImpact}</span></div>
      <div class="stat-row"><span>Time required</span><span>${o.timeRequired}</span></div>
      <div class="stat-row"><span>Difficulty</span><span>${o.difficulty}</span></div>
      <div class="stat-row"><span>Short-term impact</span><span>${o.shortTermImpact}</span></div>
      <div class="stat-row"><span>Long-term impact</span><span>${o.longTermImpact}</span></div>
      <div class="stat-row"><span>Emotional impact</span><span>${o.emotionalImpact}</span></div>
      <div class="pc-lists">
        <div class="pros"><h4>Pros</h4><ul>${(o.pros||[]).map(p=>`<li>${p}</li>`).join('')}</ul></div>
        <div class="cons"><h4>Cons</h4><ul>${(o.cons||[]).map(c=>`<li>${c}</li>`).join('')}</ul></div>
      </div>
    `;
    optCards.appendChild(el);
  });

  renderMatrix(a);
  renderCharts(a);
  renderSwot(a);
  renderRisksOpps(a);
  renderTree(a);
  document.getElementById('whatIf').textContent = a.whatIf || '';
}

function renderMatrix(a){
  const dims = ['cost','time','risk','benefits','personalGoals','futureGrowth','overall'];
  const labels = {cost:'Cost',time:'Time',risk:'Risk',benefits:'Benefits',personalGoals:'Personal Goals',futureGrowth:'Future Growth',overall:'Overall Score'};
  let best = 0, bestIdx = -1;
  (a.options||[]).forEach((o,i)=>{ if((o.matrix?.overall||0)>best){best=o.matrix.overall; bestIdx=i;} });
  let html = '<thead><tr><th>Dimension</th>' + (a.options||[]).map(o=>`<th>${o.name}</th>`).join('') + '</tr></thead><tbody>';
  dims.forEach(d=>{
    html += `<tr class="${d==='overall'?'best':''}"><td>${labels[d]}</td>` +
      (a.options||[]).map((o,i)=>`<td class="score" style="color:${i===bestIdx?'var(--accent)':'inherit'}">${o.matrix?.[d] ?? '-'}</td>`).join('') + '</tr>';
  });
  html += '</tbody>';
  document.getElementById('matrixTable').innerHTML = html;
}

function renderCharts(a){
  Object.values(state.charts).forEach(c=>c && c.destroy());
  const opts = a.options||[];
  const names = opts.map(o=>o.name);
  const colors = opts.map((_,i)=>OPT_COLORS[i%OPT_COLORS.length]);
  const ink = getComputedStyle(document.body).getPropertyValue('--ink').trim();
  Chart.defaults.color = ink; Chart.defaults.font.family = 'Inter';

  state.charts.radar = new Chart(document.getElementById('radarChart'), {
    type:'radar',
    data:{ labels:['Cost','Time','Risk','Benefits','Goals','Growth'],
      datasets: opts.map((o,i)=>({label:o.name, data:[o.matrix.cost,o.matrix.time,o.matrix.risk,o.matrix.benefits,o.matrix.personalGoals,o.matrix.futureGrowth],
        borderColor:colors[i], backgroundColor:colors[i]+'33', pointBackgroundColor:colors[i]})) },
    options:{responsive:true, maintainAspectRatio:false, plugins:{title:{display:true,text:'Radar comparison'}}, scales:{r:{suggestedMin:0,suggestedMax:10,grid:{color:'rgba(150,150,150,.15)'}}}}
  });
  state.charts.bar = new Chart(document.getElementById('barChart'), {
    type:'bar',
    data:{ labels:names, datasets:[{label:'Overall Score', data:opts.map(o=>o.matrix.overall), backgroundColor:colors}] },
    options:{responsive:true, maintainAspectRatio:false, plugins:{title:{display:true,text:'Overall score by option'}, legend:{display:false}}, scales:{y:{suggestedMax:10,grid:{color:'rgba(150,150,150,.1)'}}}}
  });
  state.charts.pie = new Chart(document.getElementById('pieChart'), {
    type:'doughnut',
    data:{ labels:names, datasets:[{data:opts.map(o=>o.successProbability), backgroundColor:colors}] },
    options:{responsive:true, maintainAspectRatio:false, plugins:{title:{display:true,text:'Success probability share'}}}
  });
}

function renderSwot(a){
  const opts = a.options||[];
  const best = opts.find(o=>o.name===a.bestOption) || opts[0];
  if(!best) return;
  document.getElementById('swotOptName').textContent = best.name;
  const s = best.swot || {strengths:[],weaknesses:[],opportunities:[],threats:[]};
  document.getElementById('swotGrid').innerHTML = `
    <div class="swot-box swot-s"><h4>Strengths</h4><ul>${(s.strengths||[]).map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="swot-box swot-w"><h4>Weaknesses</h4><ul>${(s.weaknesses||[]).map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="swot-box swot-o"><h4>Opportunities</h4><ul>${(s.opportunities||[]).map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="swot-box swot-t"><h4>Threats</h4><ul>${(s.threats||[]).map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
}

function renderRisksOpps(a){
  document.getElementById('risksOpps').innerHTML =
    (a.hiddenRisks||[]).map(r=>`<span class="tag tag-risk">⚠ ${r}</span>`).join('') +
    (a.opportunities||[]).map(o=>`<span class="tag tag-opp">✦ ${o}</span>`).join('');
}

function renderTree(a){
  document.getElementById('decisionTree').innerHTML = (a.decisionTree||[]).map(l=>`↳ ${l}`).join('<br>');
}

/* ---------- 9. EXPORTS ---------- */
document.getElementById('printBtn').addEventListener('click', ()=> window.print());

document.getElementById('csvBtn').addEventListener('click', ()=>{
  const a = state.analysis; if(!a) return;
  let rows = [['Option','Overall Rating','Success %','Confidence %','Financial Impact','Difficulty','Cost','Time','Risk','Benefits','Personal Goals','Future Growth','Overall Score']];
  (a.options||[]).forEach(o=> rows.push([o.name,o.overallRating,o.successProbability,o.confidenceScore,o.financialImpact,o.difficulty,
    o.matrix.cost,o.matrix.time,o.matrix.risk,o.matrix.benefits,o.matrix.personalGoals,o.matrix.futureGrowth,o.matrix.overall]));
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = 'decision-analysis.csv'; link.click();
  URL.revokeObjectURL(url);
  toast('CSV downloaded');
});

document.getElementById('copyBtn').addEventListener('click', ()=>{
  const a = state.analysis; if(!a) return;
  const summary = `Decision: ${document.getElementById('dTitle').value}\nBest option: ${a.bestOption}\nWhy: ${a.why}\nConfidence: ${a.finalConfidence}%\nExpected outcome: ${a.expectedOutcome}`;
  navigator.clipboard.writeText(summary).then(()=> toast('Summary copied'));
});

document.getElementById('shareBtn').addEventListener('click', ()=>{
  const a = state.analysis; if(!a) return;
  const text = `My decision "${document.getElementById('dTitle').value}" — best option: ${a.bestOption} (${a.finalConfidence}% confidence)`;
  if(navigator.share){ navigator.share({title:'MK Decision Checker', text}); }
  else{ navigator.clipboard.writeText(text); toast('Copied share text (Web Share not supported here)'); }
});

document.getElementById('speakBtn').addEventListener('click', ()=>{
  const a = state.analysis; if(!a) return;
  speak(`Best option: ${a.bestOption}. ${a.why} Final confidence: ${a.finalConfidence} percent.`);
});

/* ---------- 10. HISTORY ---------- */
async function renderHistory(filter=''){
  const list = await loadAllDecisions();
  const container = document.getElementById('histList');
  const filtered = list.filter(d=> (d.title+d.situation).toLowerCase().includes(filter.toLowerCase()));
  if(!filtered.length){ container.innerHTML = '<div class="empty">No saved decisions yet. Analyze one to see it here.</div>'; return; }
  container.innerHTML = filtered.map(d=>`
    <div class="hist-item" data-id="${d.id}">
      <div>
        <div class="h-title">${d.title}</div>
        <div class="h-meta">${new Date(d.ts).toLocaleString()} · Best: ${d.analysis?.bestOption||'—'} · ${d.analysis?.finalConfidence||0}% confidence</div>
      </div>
      <button class="hist-del" data-id="${d.id}" title="Delete">🗑</button>
    </div>`).join('');
  container.querySelectorAll('.hist-item').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.classList.contains('hist-del')) return;
      const rec = filtered.find(d=>d.id===el.dataset.id);
      loadDecisionIntoForm(rec);
    });
  });
  container.querySelectorAll('.hist-del').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      e.stopPropagation();
      await deleteDecision(btn.dataset.id);
      renderHistory(document.getElementById('histSearch').value);
      toast('Deleted');
    });
  });
}
function loadDecisionIntoForm(rec){
  document.querySelector('.tab[data-tab="new"]').click();
  document.getElementById('dTitle').value = rec.title;
  document.getElementById('dDesc').value = rec.situation;
  document.getElementById('dGoal').value = rec.goal;
  document.getElementById('dBudget').value = rec.budget;
  document.getElementById('dTime').value = rec.timeLimit;
  document.getElementById('dImportance').value = rec.importance;
  state.options = rec.options.length>1 ? [...rec.options] : ['',''];
  renderOptions();
  state.analysis = rec.analysis;
  renderResults(rec.analysis, rec);
  document.getElementById('results').style.display = 'block';
}
document.getElementById('histSearch').addEventListener('input', e=> renderHistory(e.target.value));

/* ---------- 11. TABS ---------- */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-new').style.display = tab.dataset.tab==='new' ? 'block':'none';
    document.getElementById('tab-history').style.display = tab.dataset.tab==='history' ? 'block':'none';
    if(tab.dataset.tab==='history') renderHistory();
  });
});

/* ---------- 12. THEME ---------- */
function setTheme(mode){
  document.body.dataset.theme = mode;
  document.getElementById('themeBtn').textContent = mode==='dark' ? '🌙' : '☀️';
  if(state.analysis) renderCharts(state.analysis); // refresh chart colors
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  setTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');
});
setTheme('dark');

/* ---------- 13. TOAST ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ---------- 14. KEYBOARD SHORTCUTS ---------- */
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); document.getElementById('analyzeBtn').click(); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='d'){ e.preventDefault(); document.getElementById('themeBtn').click(); }
});

/* ---------- 15. INIT ---------- */
(async function init(){
  try{ await window.storage.list('decision:', false); }catch(e){ state.storageAvailable=false; }
})();
</script>
